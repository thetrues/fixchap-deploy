# FixChap production stack: nginx (HTTPS) -> app (Next.js) -> PostgreSQL.
# Deploy with ./deployme.sh, certificates with ./sslrenew.sh
name: fixchap

services:
  app:
    build: .
    image: fixchap-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_DIR: /data/storage
      HANDYMAN_IMG_DIR: /data/handyman_img
      FCM_CREDENTIALS_FILE: /app/secrets/credentials-file.json
    volumes:
      # Uploaded photos. Point these at the old Laravel folders in .env to keep existing photos.
      - ${STORAGE_HOST_DIR:-./data/storage}:/data/storage
      - ${HANDYMAN_IMG_HOST_DIR:-./data/handyman_img}:/data/handyman_img
      - ./secrets:/app/secrets:ro
    ports:
      # for health checks from the server itself; public traffic goes through nginx
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # used by nginx/templates/*.template (filled in when nginx starts)
      SERVER_NAMES: ${SERVER_NAMES}
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
      - ./database:/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ---- run on demand only (sslrenew.sh) ----
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  # ---- only used by scripts/migrate-from-dump.sh ----
  mysql-temp:
    image: mariadb:11
    profiles: ["migrate"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MIGRATE_MYSQL_PASSWORD:-fixchap-temp-only}
      MARIADB_DATABASE: fixchap
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  pgloader:
    image: ghcr.io/dimitri/pgloader:latest
    profiles: ["migrate"]
    volumes:
      - ./database:/database:ro

volumes:
  pgdata:
